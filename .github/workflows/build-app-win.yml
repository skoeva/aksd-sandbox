name: Sandbox Windows ARM64 installer validation

on:
  workflow_dispatch:
    inputs:
      aks_plugin_branch:
        description: Exact PR 1114 source commit to build
        required: true
        default: 697e0bfd1ce1c903967d1d2ce307ea8c5e676922
      reuse_installer:
        description: Test the existing provenance-checked PR installer instead of rebuilding
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  installed-arm64:
    if: github.repository == 'skoeva/aksd-sandbox'
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      AKS_INSTALL_RESULTS: installer-test-results
      EXPECTED_SOURCE_SHA: 697e0bfd1ce1c903967d1d2ce307ea8c5e676922
    steps:
      - name: Checkout exact application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.aks_plugin_branch }}
          persist-credentials: false

      - name: Checkout sandbox-only test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .installer-validation
          sparse-checkout: test/installer
          persist-credentials: false

      - name: Validate PowerShell harness syntax
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD '.installer-validation/test/installer/windows-lifecycle.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw 'Invalid installer validation script'
          }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.2
          cache: npm

      - name: Resolve Headlamp Go version
        if: ${{ !inputs.reuse_installer }}
        id: go-version
        shell: bash
        run: echo "version=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types build/go-version.ts)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: ${{ !inputs.reuse_installer }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: |
            packages/headlamp-source/package.json
            patches/*.patch

      - name: Setup pinned npm
        run: |
          npm ci --prefix .config/npm --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:GITHUB_WORKSPACE '.config/npm/node_modules/.bin' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        if: ${{ !inputs.reuse_installer }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install UI test dependencies only
        if: inputs.reuse_installer
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download exact existing PR installer
        if: inputs.reuse_installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
          }
          $uri = 'https://api.github.com/repos/Azure/aks-desktop/actions/artifacts/13552101566'
          $metadata = Invoke-RestMethod -Uri $uri -Headers $headers
          if ($metadata.expired -or $metadata.workflow_run.head_sha -ne $env:EXPECTED_SOURCE_SHA) {
            throw 'The upstream artifact does not match the reviewed PR source'
          }
          $expected = 'sha256:9f4a714c476cdfdafb96c1a97b1d34c691f7a9d43061afa2aa9dbc9f11a0467c'
          if ($metadata.digest -ne $expected) { throw 'Unexpected upstream artifact digest' }
          $archive = Join-Path $env:RUNNER_TEMP 'aks-pr1114-installer.zip'
          Invoke-WebRequest -Uri "$uri/zip" -Headers $headers -OutFile $archive
          $digest = 'sha256:' + (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $expected) { throw 'Downloaded installer archive failed digest verification' }
          $dist = Join-Path $PWD 'node_modules/@headlamp-k8s/headlamp-source/source/app/dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $dist
          New-Item -ItemType Directory -Force -Path $env:AKS_INSTALL_RESULTS | Out-Null
          $metadata | ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath (Join-Path $env:AKS_INSTALL_RESULTS 'artifact-provenance.json')

      - name: Build exact PR Windows ARM64 installer
        if: ${{ !inputs.reuse_installer }}
        run: npm run build:win:arm64

      - name: Validate unpacked application and bundled tools
        if: ${{ !inputs.reuse_installer }}
        run: npm run test:distribution

      - name: Install, validate installed GUI, and uninstall
        timeout-minutes: 15
        run: |
          & ./.installer-validation/test/installer/windows-lifecycle.ps1 `
            -SourceRoot $PWD `
            -ResultsDir $env:AKS_INSTALL_RESULTS

      - name: Upload installer lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aks-pr1114-installer-validation
          path: |
            ${{ env.AKS_INSTALL_RESULTS }}
            test/packaged/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Retain unsigned test installer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aks-pr1114-windows-arm64-installer
          path: node_modules/@headlamp-k8s/headlamp-source/source/app/dist/aks-desktop-*-win-arm64.exe
          if-no-files-found: warn
          retention-days: 7
